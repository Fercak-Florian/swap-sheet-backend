services:
  nginx:
    image: nginx:1.27-alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/build/default.conf:/etc/nginx/conf.d/default.conf:ro
      - symfony_public:/var/www/symfony/public:ro
    depends_on:
      - php
    networks:
      - symfony_net

  php:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: symfony_php
    environment:
#      APP_ENV: ${APP_ENV:-prod}
          DATABASE_URL: mysql://symfony:symfony@database:3306/symfony_db?serverVersion=8.0
    volumes:
      - symfony_public:/var/www/symfony/public
      # En dev, décommente la ligne suivante pour monter tout le code en live
      # - .:/var/www/symfony
    #    depends_on:
    #      - database
    networks:
      - symfony_net

  database:
    image: mysql:8.0
    container_name: symfony_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony_db
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - symfony_db_data:/var/lib/mysql
    networks:
      - symfony_net

  # Optionnel : décommente si tu veux gérer la base via une interface web
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: symfony_phpmyadmin
  #   environment:
  #     PMA_HOST: database
  #   ports:
  #     - "8081:80"
  #   depends_on:
  #     - database
  #   networks:
  #     - symfony_net

networks:
  symfony_net:
    driver: bridge

volumes:
  symfony_public:
  symfony_db_data: